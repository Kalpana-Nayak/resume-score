<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Resume Ranker</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background:#f4f4f4;
            margin:0;
        }

        .container{

            width:70%;
            margin:40px auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 15px rgba(0,0,0,.1);

        }

        h1{

            text-align:center;
            color:#2c3e50;

        }

        label{

            font-weight:bold;

        }

        textarea{

            width:100%;
            height:180px;
            margin-top:10px;
            margin-bottom:20px;
            padding:10px;
            font-size:15px;

        }

        input{

            margin-top:10px;
            margin-bottom:20px;

        }

        button{

            width:100%;
            padding:15px;
            background:#007bff;
            color:white;
            border:none;
            border-radius:5px;
            font-size:18px;
            cursor:pointer;

        }

        button:hover{

            background:#0056b3;

        }

    </style>

</head>
<body>

<div class="container">

<h1>AI Resume Ranker</h1>

<form action="/upload" method="POST" enctype="multipart/form-data">

<label>Upload Resume(s)</label>

<br>

<input
type="file"
name="resumes"
multiple
accept=".pdf"
required>

<br><br>

<label>Paste Job Description</label>

<textarea
name="job_description" 
placeholder="Paste Job Description here..."
required></textarea>

<button type="submit">

Rank Resumes

</button>

</form>

</div>

</body>
</html>
